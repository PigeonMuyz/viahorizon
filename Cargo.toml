[package]
name = "viafabricplus-native"
version = "0.8.2-dev"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false
autotests = false
description = "Release-only ViaFabricPlus port for Horizon 26.3 (early development)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vfp-native"
path = "cli/main.rs"

[dependencies]
serde_json = "=1.0.151"

[[test]]
name = "protocol"
path = "tests/protocol.rs"

[[test]]
name = "wire"
path = "tests/wire.rs"

[[test]]
name = "mining"
path = "tests/mining.rs"

[[test]]
name = "hash"
path = "tests/hash.rs"
